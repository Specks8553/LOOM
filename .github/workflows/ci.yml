name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (build · clippy · test · ts-rs drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps for Tauri v2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            librsvg2-dev libayatana-appindicator3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: SB-5 grep gate (raw .lock() forbidden outside state/access.rs)
        working-directory: src-tauri
        run: |
          # Doc 24 §AppState Access: `state\.\w+_(?:conn|key|tx)\.lock\(\)` — extended
          # here to include `_id` and `app_phase` since helpers exist for those too.
          if grep -rnE 'state\.(master_key|api_key|settings_conn|active_conn|active_world_id|cancel_tx|app_phase)\.lock\(\)' \
              --include='*.rs' \
              --exclude-dir=target \
              src/ \
              | grep -v '^src/state/access.rs:'; then
            echo "::error::SB-5 violation: raw .lock() on AppState fields outside state/access.rs. Use the with_*/replace_* helpers."
            exit 1
          fi

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --all-features

      - name: ts-rs drift check
        run: |
          cd src-tauri && cargo test --test ts_rs_export
          cd ..
          git diff --exit-code src/lib/types.generated.ts

  frontend:
    name: Frontend (tsc · eslint · prettier · SB-2 fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:eslint-fixture
